# 2026-10-24 platform audit, FINDING-009: keep npm, Cargo and pinned Action SHAs current.
# Monthly: each update PR runs the full native matrix. Security updates are not tied to this schedule.
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: monthly
    open-pull-requests-limit: 10
    # Expo SDK pins these: bump them with `expo install` during an SDK upgrade, not one by one.
    ignore:
      - dependency-name: 'expo*'
        update-types: ['version-update:semver-major']
      - dependency-name: 'react-native*'
        update-types: ['version-update:semver-major']
      - dependency-name: '@react-native*'
        update-types: ['version-update:semver-major']
    groups:
      wdio:
        patterns: ['@wdio/*']
      npm-minor-and-patch:
        update-types: [minor, patch]

  - package-ecosystem: cargo
    directory: /apps/desktop/src-tauri
    schedule:
      interval: monthly
    open-pull-requests-limit: 5
    groups:
      cargo-minor-and-patch:
        update-types: [minor, patch]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    groups:
      actions:
        patterns: ['*']
