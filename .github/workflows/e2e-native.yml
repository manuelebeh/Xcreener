name: Native E2E

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: e2e-native-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  native-e2e-webdriver:
    name: WebDriver (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        include:
          # 24.04: PipeWire 1.0 headers match libspa 0.9 (xcap). jammy 0.3.48 breaks the build.
          - os: ubuntu-24.04
          - os: windows-latest

    runs-on: ${{ matrix.os }}
    env:
      # The Tauri dependency tree fills the Linux runner disk with debug info: keep symbols out of CI builds.
      CARGO_PROFILE_DEV_DEBUG: '0'
      CARGO_PROFILE_TEST_DEBUG: '0'
    steps:
      - name: Free disk space (Linux)
        if: runner.os == 'Linux'
        run: sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL

      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: jdx/mise-action@c37c93293d6b742fc901e1406b8f764f6fb19dac # v2
        with:
          install: true

      - name: Install Linux WebDriver dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libgtk-3-dev \
            libwebkit2gtk-4.1-dev \
            libayatana-appindicator3-dev \
            libpipewire-0.3-dev \
            libgbm-dev \
            webkit2gtk-driver \
            xvfb

      - name: Expose WebKitWebDriver on PATH (Linux)
        if: runner.os == 'Linux'
        run: |
          # On Ubuntu 24.04 webkit2gtk-driver installs the binary under a versioned lib directory.
          if ! command -v WebKitWebDriver >/dev/null; then
            driver="$(dpkg -L webkit2gtk-driver | grep -E '/WebKitWebDriver$' | head -n 1)"
            sudo ln -sf "$driver" /usr/local/bin/WebKitWebDriver
          fi
          command -v WebKitWebDriver
          WebKitWebDriver --version || true

      - name: Show Edge and WebView2 runtime versions (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $edge = 'HKLM:\SOFTWARE\WOW6432Node\Microsoft\EdgeUpdate\Clients\{56EB18F8-B008-4CBD-B6D2-8C97FE7E9062}'
          $webview = 'HKLM:\SOFTWARE\WOW6432Node\Microsoft\EdgeUpdate\Clients\{F3017226-FE2A-4295-8BDF-00C3A9A7E4C5}'
          "Edge: $((Get-ItemProperty $edge -ErrorAction SilentlyContinue).pv)"
          "WebView2 runtime: $((Get-ItemProperty $webview -ErrorAction SilentlyContinue).pv)"

      - name: Install msedgedriver (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          cargo install --git https://github.com/chippers/msedgedriver-tool
          & "$HOME/.cargo/bin/msedgedriver-tool.exe"
          if (-not (Test-Path "$PWD\msedgedriver.exe")) {
            throw "msedgedriver.exe was not downloaded into $PWD"
          }
          # Match Tauri CI docs: PathInfo.Path, not the PathInfo object stringification.
          $PWD.Path >> $env:GITHUB_PATH
          "TAURI_NATIVE_DRIVER=$($PWD.Path)\msedgedriver.exe" >> $env:GITHUB_ENV
          & "$PWD\msedgedriver.exe" --version

      - name: Install dependencies
        run: mise run install

      - name: Build design tokens
        run: mise run tokens:build

      - name: Install tauri-driver
        run: cargo install tauri-driver --locked

      - name: Native integration tests (WebDriver)
        run: mise run test:e2e:native
        env:
          # Inherited by msedgedriver → app so WebView2 initializes for session create.
          TAURI_WEBVIEW_AUTOMATION: "true"

  native-e2e-macos:
    name: macOS (Rust + build)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: jdx/mise-action@c37c93293d6b742fc901e1406b8f764f6fb19dac # v2
        with:
          install: true

      - name: Install dependencies
        run: mise run install

      - name: Build design tokens
        run: mise run tokens:build

      - name: Verify debug build and run Rust integration tests
        run: mise run test:e2e:native
