name: VS Code Extension

on:
  push:
    tags:
      - 'vscode-v*'
  pull_request:
    paths:
      - 'apps/vscode-extension/**'
      - 'packages/sdk/**'
      - 'packages/plugin-core/**'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm --filter snapglow-vscode test
      - run: pnpm --filter snapglow-vscode typecheck
      - run: pnpm --filter snapglow-vscode lint
      - run: pnpm --filter snapglow-vscode package

      - name: Publish to Marketplace
        if: startsWith(github.ref, 'refs/tags/vscode-v')
        working-directory: apps/vscode-extension
        env:
          VSCE_PAT: ${{ secrets.VSCE_PAT }}
        run: pnpm exec vsce publish --no-dependencies
