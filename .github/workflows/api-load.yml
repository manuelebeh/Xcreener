name: API load test

on:
  workflow_dispatch:
  schedule:
    - cron: '0 4 * * 1'

permissions:
  contents: read

jobs:
  load:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: snapglow
          POSTGRES_PASSWORD: snapglow
          POSTGRES_DB: snapglow
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U snapglow"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7
        ports:
          - 6379:6379
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: jdx/mise-action@c37c93293d6b742fc901e1406b8f764f6fb19dac # v2

      - name: Install dependencies
        run: mise run install

      - name: Start MinIO
        run: docker compose -f apps/api/docker-compose.yml up -d minio

      - name: Apply migrations
        working-directory: apps/api
        env:
          DATABASE_URL: postgresql://snapglow:snapglow@localhost:5432/snapglow
          REDIS_URL: redis://localhost:6379
          AUTH0_DOMAIN: load-test.auth0.com
          AUTH0_AUDIENCE: https://api.snapglow.app
          WEB_PUBLIC_URL: http://localhost:3000
          S3_ENDPOINT: http://localhost:9000
          S3_BUCKET: snapglow-shares
          S3_ACCESS_KEY: minioadmin
          S3_SECRET_KEY: minioadmin
          API_RATE_LIMIT_GENERAL: '2000'
        run: pnpm db:migrate

      - name: Seed load fixture
        id: seed
        working-directory: apps/api
        env:
          DATABASE_URL: postgresql://snapglow:snapglow@localhost:5432/snapglow
          REDIS_URL: redis://localhost:6379
          AUTH0_DOMAIN: load-test.auth0.com
          AUTH0_AUDIENCE: https://api.snapglow.app
          WEB_PUBLIC_URL: http://localhost:3000
          S3_ENDPOINT: http://localhost:9000
          S3_BUCKET: snapglow-shares
          S3_ACCESS_KEY: minioadmin
          S3_SECRET_KEY: minioadmin
        run: |
          output=$(pnpm exec tsx scripts/seed-load-fixture.ts)
          echo "$output"
          echo "$output" >> "$GITHUB_OUTPUT"

      - name: Start API
        working-directory: apps/api
        env:
          DATABASE_URL: postgresql://snapglow:snapglow@localhost:5432/snapglow
          REDIS_URL: redis://localhost:6379
          AUTH0_DOMAIN: load-test.auth0.com
          AUTH0_AUDIENCE: https://api.snapglow.app
          WEB_PUBLIC_URL: http://localhost:3000
          S3_ENDPOINT: http://localhost:9000
          S3_BUCKET: snapglow-shares
          S3_ACCESS_KEY: minioadmin
          S3_SECRET_KEY: minioadmin
          API_RATE_LIMIT_GENERAL: '2000'
          PORT: '8787'
        run: pnpm exec tsx src/index.ts &

      - name: Wait for API
        run: |
          for i in $(seq 1 30); do
            curl -sf http://localhost:8787/health && exit 0
            sleep 2
          done
          exit 1

      - name: Install k6
        run: |
          sudo gpg -k
          sudo gpg --no-default-keyring --keyring /usr/share/keyrings/k6-archive-keyring.gpg --keyserver hkp://keyserver.ubuntu.com:80 --recv-keys C5AD17C747E3415A3642D57D77C6C491D6991E61
          echo "deb [signed-by=/usr/share/keyrings/k6-archive-keyring.gpg] https://dl.k6.io/deb stable main" | sudo tee /etc/apt/sources.list.d/k6.list
          sudo apt-get update
          sudo apt-get install -y k6

      - name: Run k6 baseline (short)
        working-directory: apps/api
        env:
          LOAD_TEST_BASE_URL: http://localhost:8787
        run: |
          eval "$(pnpm exec tsx scripts/seed-load-fixture.ts | grep '^LOAD_TEST_' | xargs -I{} echo export {})"
          k6 run -e BASE_URL="$LOAD_TEST_BASE_URL" \
            -e API_KEY="$LOAD_TEST_API_KEY" \
            -e CAPTURE_ID="$LOAD_TEST_CAPTURE_ID" \
            --duration 1m \
            --vus 10 \
            load/scenarios/baseline.js
