name: API load test

on:
  workflow_dispatch:
  schedule:
    - cron: '0 4 * * 1'

permissions:
  contents: read

jobs:
  load:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: snapglow
          POSTGRES_PASSWORD: snapglow
          POSTGRES_DB: snapglow
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U snapglow"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7
        ports:
          - 6379:6379
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: jdx/mise-action@8418fedb1110381a0d3ba51a7a415d7c1b884550 # v5.2.2

      - name: Install dependencies
        run: mise run install

      - name: Start MinIO
        run: docker compose -f apps/api/docker-compose.yml up -d minio

      - name: Apply migrations
        working-directory: apps/api
        env:
          DATABASE_URL: postgresql://snapglow:snapglow@localhost:5432/snapglow
          REDIS_URL: redis://localhost:6379
          AUTH0_DOMAIN: load-test.auth0.com
          AUTH0_AUDIENCE: https://api.snapglow.app
          WEB_PUBLIC_URL: http://localhost:3000
          S3_ENDPOINT: http://localhost:9000
          S3_BUCKET: snapglow-shares
          S3_ACCESS_KEY: minioadmin
          S3_SECRET_KEY: minioadmin
          API_RATE_LIMIT_GENERAL: '2000'
        run: pnpm db:migrate

      - name: Seed load fixture
        id: seed
        working-directory: apps/api
        env:
          DATABASE_URL: postgresql://snapglow:snapglow@localhost:5432/snapglow
          REDIS_URL: redis://localhost:6379
          AUTH0_DOMAIN: load-test.auth0.com
          AUTH0_AUDIENCE: https://api.snapglow.app
          WEB_PUBLIC_URL: http://localhost:3000
          S3_ENDPOINT: http://localhost:9000
          S3_BUCKET: snapglow-shares
          S3_ACCESS_KEY: minioadmin
          S3_SECRET_KEY: minioadmin
        run: |
          output=$(pnpm exec tsx scripts/seed-load-fixture.ts)
          # GITHUB_OUTPUT only takes key=value lines, so drop the script's intro line.
          echo "$output" | grep '^LOAD_TEST_' >> "$GITHUB_OUTPUT"

      - name: Start API
        working-directory: apps/api
        env:
          DATABASE_URL: postgresql://snapglow:snapglow@localhost:5432/snapglow
          REDIS_URL: redis://localhost:6379
          AUTH0_DOMAIN: load-test.auth0.com
          AUTH0_AUDIENCE: https://api.snapglow.app
          WEB_PUBLIC_URL: http://localhost:3000
          S3_ENDPOINT: http://localhost:9000
          S3_BUCKET: snapglow-shares
          S3_ACCESS_KEY: minioadmin
          S3_SECRET_KEY: minioadmin
          API_RATE_LIMIT_GENERAL: '2000'
          PORT: '8787'
        run: pnpm exec tsx src/index.ts &

      - name: Wait for API
        run: |
          for i in $(seq 1 30); do
            curl -sf http://localhost:8787/health && exit 0
            sleep 2
          done
          exit 1

      - name: Install k6
        run: |
          curl -fsSL https://dl.k6.io/key.gpg | sudo gpg --dearmor -o /usr/share/keyrings/k6-archive-keyring.gpg
          echo "deb [signed-by=/usr/share/keyrings/k6-archive-keyring.gpg] https://dl.k6.io/deb stable main" | sudo tee /etc/apt/sources.list.d/k6.list
          sudo apt-get update
          sudo apt-get install -y k6

      - name: Run k6 baseline (short)
        working-directory: apps/api
        env:
          LOAD_TEST_BASE_URL: http://localhost:8787
          LOAD_TEST_API_KEY: ${{ steps.seed.outputs.LOAD_TEST_API_KEY }}
          LOAD_TEST_CAPTURE_ID: ${{ steps.seed.outputs.LOAD_TEST_CAPTURE_ID }}
        run: |
          k6 run -e BASE_URL="$LOAD_TEST_BASE_URL" \
            -e API_KEY="$LOAD_TEST_API_KEY" \
            -e CAPTURE_ID="$LOAD_TEST_CAPTURE_ID" \
            --duration 1m \
            --vus 10 \
            load/scenarios/baseline.js
