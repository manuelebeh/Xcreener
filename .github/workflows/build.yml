name: Build

# Manual only: Native E2E already compiles the app on main. Run this when you need installers.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-tauri:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-latest
            args: --target aarch64-apple-darwin
          - platform: macos-latest
            args: --target x86_64-apple-darwin
          - platform: windows-latest
            args: ''

    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: jdx/mise-action@c37c93293d6b742fc901e1406b8f764f6fb19dac # v2
        with:
          install: true

      - name: Install dependencies
        run: mise run install

      - name: Build design tokens
        run: mise run tokens:build

      - name: Install Rust targets (macOS)
        if: runner.os == 'macOS'
        run: rustup target add aarch64-apple-darwin x86_64-apple-darwin

      # Unsigned smoke builds only. Apple/Windows signing lives in release.yml
      # once certs are provisioned (see docs/guides/release-signing.md).
      - uses: tauri-apps/tauri-action@84b9d35b5fc46c1e45415bdb6144030364f7ebc5 # v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Optional here: without it, smoke builds treat every account as free.
          XCREENER_ENTITLEMENT_PUBLIC_KEY: ${{ vars.XCREENER_ENTITLEMENT_PUBLIC_KEY }}
        with:
          projectPath: apps/desktop
          args: ${{ matrix.args }}

      - name: Upload unsigned artifacts
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: xcreener-${{ matrix.platform }}-${{ matrix.args || 'default' }}
          # `--target` builds land in target/<triple>/release, default builds in target/release.
          path: |
            apps/desktop/src-tauri/target/**/release/bundle/dmg/*.dmg
            apps/desktop/src-tauri/target/**/release/bundle/msi/*.msi
            apps/desktop/src-tauri/target/**/release/bundle/nsis/*.exe
          if-no-files-found: ignore
