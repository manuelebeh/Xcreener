name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  # Every commit on main keeps its own verdict (trunk-based): only PR runs get superseded.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  # Skipped jobs count as passed, so filtering here (not with `on.paths`) never leaves a check pending.
  changes:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    outputs:
      rust: ${{ steps.filter.outputs.rust }}
      desktop: ${{ steps.filter.outputs.desktop }}
      web: ${{ steps.filter.outputs.web }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        id: filter
        with:
          filters: |
            shared: &shared
              - 'package.json'
              - 'pnpm-lock.yaml'
              - 'pnpm-workspace.yaml'
              - 'turbo.json'
              - 'mise.toml'
              - '.github/workflows/ci.yml'
            rust:
              - 'apps/desktop/src-tauri/**'
              # Embedded with include_str! by src-tauri/src/db/migrations.rs.
              - 'apps/desktop/src/db/migrations/**'
              - 'mise.toml'
              - '.github/workflows/ci.yml'
            desktop:
              - *shared
              - 'apps/desktop/**'
              - 'packages/**'
            web:
              - *shared
              - 'apps/web/**'
              - 'packages/**'

  js:
    needs: changes
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: xcreener
          POSTGRES_PASSWORD: xcreener
          POSTGRES_DB: xcreener
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U xcreener -d xcreener"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7-alpine
        ports: ['6379:6379']
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      # Enables apps/api/src/routes/security.integration.test.ts against the service above.
      INTEGRATION_DATABASE_URL: postgresql://xcreener:xcreener@localhost:5432/xcreener
      # `turbo --affected` diffs against this commit. When it is missing (new branch), turbo runs everything.
      TURBO_SCM_BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0

      - uses: jdx/mise-action@c37c93293d6b742fc901e1406b8f764f6fb19dac # v2
        with:
          install: true

      - name: Install dependencies
        run: mise run install

      - name: Build design tokens
        run: mise run tokens:build

      - name: Lint
        run: mise exec -- pnpm turbo lint --affected

      - name: Typecheck
        run: mise exec -- pnpm turbo typecheck --affected

      - name: Apply API migrations
        env:
          DATABASE_URL: postgresql://xcreener:xcreener@localhost:5432/xcreener
          REDIS_URL: redis://localhost:6379
          AUTH0_DOMAIN: example.auth0.com
          AUTH0_AUDIENCE: https://api.example.com
          WEB_PUBLIC_URL: http://localhost:3000
          S3_ENDPOINT: http://localhost:9000
          S3_BUCKET: xcreener-shares
          S3_ACCESS_KEY: minioadmin
          S3_SECRET_KEY: minioadmin
        run: mise exec -- pnpm --filter @xcreener/api db:migrate

      # schema.ts, the SQL migrations and drizzle/meta must agree: a schema change without its
      # generated migration (or a stale snapshot) fails here instead of on the next db:generate.
      - name: API migration drift check
        working-directory: apps/api
        run: |
          mise exec -- pnpm exec drizzle-kit check
          mise exec -- pnpm exec drizzle-kit generate --name drift_check
          git status --porcelain -- drizzle
          test -z "$(git status --porcelain -- drizzle)"

      - name: Unit and integration tests
        run: mise exec -- pnpm turbo test --affected

      - name: Playwright smoke (web UI)
        if: needs.changes.outputs.desktop == 'true'
        working-directory: apps/desktop
        run: pnpm exec playwright install chromium && pnpm test:e2e

      - name: Build web
        if: needs.changes.outputs.web == 'true'
        run: mise exec -- pnpm --filter @xcreener/web build

  rust:
    needs: changes
    if: needs.changes.outputs.rust == 'true'
    # 24.04: PipeWire 1.0 headers match libspa 0.9 (xcap). Pinned so the ubuntu-latest move does not break the Rust build.
    runs-on: ubuntu-24.04
    env:
      # The Tauri dependency tree fills the runner disk with debug info: keep symbols out of CI builds.
      CARGO_PROFILE_DEV_DEBUG: '0'
      CARGO_PROFILE_TEST_DEBUG: '0'
    steps:
      - name: Free disk space
        run: sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL

      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: jdx/mise-action@c37c93293d6b742fc901e1406b8f764f6fb19dac # v2
        with:
          install: true

      - name: Install Linux desktop build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libgtk-3-dev \
            libwebkit2gtk-4.1-dev \
            libayatana-appindicator3-dev \
            libpipewire-0.3-dev \
            libgbm-dev

      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: apps/desktop/src-tauri

      # tauri::generate_context! only checks that frontendDist exists; tests do not need the real UI.
      - name: Stub frontend dist
        run: mkdir -p apps/desktop/dist

      - name: Rust tests
        working-directory: apps/desktop/src-tauri
        run: cargo test --locked

      - name: Rust lint (clippy)
        working-directory: apps/desktop/src-tauri
        run: |
          rustup component add clippy
          cargo clippy --all-targets --locked -- -D warnings

  security:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0

      - uses: jdx/mise-action@c37c93293d6b742fc901e1406b8f764f6fb19dac # v2
        with:
          install: true

      - name: Install dependencies
        run: mise run install

      # Blocking. Reviewed exceptions (Expo toolchain, nitro-nightly's Azure storage driver) are
      # listed in pnpm.auditConfig.ignoreGhsas in the root package.json.
      - name: Dependency audit (production)
        run: mise exec -- pnpm audit --prod --audit-level high

      # Prebuilt binary: compiling cargo-audit on every run took minutes.
      - uses: taiki-e/install-action@1e29709c0ec63babbe8f266397a465f29a825f91 # v2.87.31
        with:
          tool: cargo-audit

      # Reviewed exceptions live in apps/desktop/src-tauri/.cargo/audit.toml.
      - name: Rust dependency audit
        working-directory: apps/desktop/src-tauri
        run: cargo audit

      - name: Secret scan
        uses: gitleaks/gitleaks-action@ff98106e4c7b2bc287b24eaf42907196329070c7 # v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
