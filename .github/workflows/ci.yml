name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  quality:
    # 24.04: PipeWire 1.0 headers match libspa 0.9 (xcap). Pinned so the ubuntu-latest move does not break the Rust build.
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: snapglow
          POSTGRES_PASSWORD: snapglow
          POSTGRES_DB: snapglow
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U snapglow -d snapglow"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7-alpine
        ports: ['6379:6379']
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      # Enables apps/api/src/routes/security.integration.test.ts against the service above.
      INTEGRATION_DATABASE_URL: postgresql://snapglow:snapglow@localhost:5432/snapglow
      # The Tauri dependency tree fills the runner disk with debug info: keep symbols out of CI builds.
      CARGO_PROFILE_DEV_DEBUG: '0'
      CARGO_PROFILE_TEST_DEBUG: '0'
    steps:
      - name: Free disk space
        run: sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: jdx/mise-action@8418fedb1110381a0d3ba51a7a415d7c1b884550 # v5.2.2
        with:
          install: true

      - name: Install Linux desktop build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libgtk-3-dev \
            libwebkit2gtk-4.1-dev \
            libayatana-appindicator3-dev \
            libpipewire-0.3-dev \
            libgbm-dev

      - name: Install dependencies
        run: mise run install

      - name: Build design tokens
        run: mise run tokens:build

      - name: Lint
        run: mise run lint

      - name: Typecheck
        run: mise run typecheck

      - name: Apply API migrations
        env:
          DATABASE_URL: postgresql://snapglow:snapglow@localhost:5432/snapglow
          REDIS_URL: redis://localhost:6379
          AUTH0_DOMAIN: example.auth0.com
          AUTH0_AUDIENCE: https://api.example.com
          WEB_PUBLIC_URL: http://localhost:3000
          S3_ENDPOINT: http://localhost:9000
          S3_BUCKET: snapglow-shares
          S3_ACCESS_KEY: minioadmin
          S3_SECRET_KEY: minioadmin
        run: mise exec -- pnpm --filter @snapglow/api db:migrate

      # schema.ts, the SQL migrations and drizzle/meta must agree: a schema change without its
      # generated migration (or a stale snapshot) fails here instead of on the next db:generate.
      - name: API migration drift check
        working-directory: apps/api
        run: |
          mise exec -- pnpm exec drizzle-kit check
          mise exec -- pnpm exec drizzle-kit generate --name drift_check
          git status --porcelain -- drizzle
          test -z "$(git status --porcelain -- drizzle)"

      - name: Unit and integration tests
        run: mise run test

      - name: Playwright smoke (web UI)
        working-directory: apps/desktop
        run: pnpm exec playwright install chromium && pnpm test:e2e

      - name: Rust tests
        working-directory: apps/desktop/src-tauri
        run: cargo test --locked

      - name: Rust lint (clippy)
        working-directory: apps/desktop/src-tauri
        run: |
          rustup component add clippy
          cargo clippy --all-targets --locked -- -D warnings

      - name: Build web
        run: mise exec -- pnpm --filter @snapglow/web build

  security:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - uses: jdx/mise-action@8418fedb1110381a0d3ba51a7a415d7c1b884550 # v5.2.2
        with:
          install: true

      - name: Install dependencies
        run: mise run install

      # Blocking. Reviewed exceptions (Expo toolchain, nitro-nightly's Azure storage driver) are
      # listed in pnpm.auditConfig.ignoreGhsas in the root package.json.
      - name: Dependency audit (production)
        run: mise exec -- pnpm audit --prod --audit-level high

      # Reviewed exceptions live in apps/desktop/src-tauri/.cargo/audit.toml.
      - name: Rust dependency audit
        working-directory: apps/desktop/src-tauri
        run: |
          cargo install cargo-audit --locked
          cargo audit

      - name: Secret scan
        uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
