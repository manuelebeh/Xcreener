[package]
name = "snapglow-desktop"
version = "0.1.0"
description = "SnapGlow desktop application"
authors = ["SnapGlow"]
edition = "2021"

[lib]
name = "snapglow_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["protocol-asset", "tray-icon", "macos-private-api", "image-png"] }
tauri-plugin-global-shortcut = "2"
tauri-plugin-autostart = "2"
tauri-plugin-updater = "2"
tauri-plugin-process = "2"
tauri-plugin-clipboard-manager = "2"
tauri-plugin-dialog = "2"
tauri-plugin-deep-link = "2"
tauri-plugin-opener = "2"
tauri-plugin-fs = "2"
regex = "1"
rusqlite = { version = "0.32", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
image = "0.25"
xcap = "0.9"
thiserror = "2"
tract-tflite = "0.21"
tempfile = "3"
imagequant = "4.3"
png = "0.17"
webp = "0.3"
gif = "0.13"
openh264 = "0.6"
mp4 = "0.14"
bytes = "1"
open = "5"
keyring = { version = "3", default-features = false, features = ["apple-native", "windows-native", "linux-native"] }
ring = "0.17"
base64 = "0.22"

[target.'cfg(target_os = "macos")'.dependencies]
screencapturekit = "8"
objc2 = { version = "0.6", default-features = false, features = ["std"] }
objc2-app-kit = { version = "0.3", default-features = false, features = ["std", "NSApplication", "NSRunningApplication", "NSWindow"] }
objc2-core-graphics = { version = "0.3", default-features = false, features = ["std", "CGWindow"] }
objc2-foundation = { version = "0.3", default-features = false, features = ["std", "NSData", "NSDictionary", "NSArray", "NSString", "NSError"] }
objc2-vision = { version = "0.3", default-features = false, features = ["std", "VNRecognizeTextRequest", "VNRequestHandler", "VNRequest", "VNObservation", "VNTypes", "block2", "objc2-core-foundation"] }

[target.'cfg(target_os = "windows")'.dependencies]
windows = { version = "0.58", features = [
  "Foundation",
  "Foundation_Collections",
  "Graphics_Imaging",
  "Media_Ocr",
  "Storage_Streams",
  "Win32_Graphics_Gdi",
  "Win32_UI_HiDpi",
  "Win32_UI_Input_KeyboardAndMouse",
  "Win32_UI_WindowsAndMessaging",
] }
