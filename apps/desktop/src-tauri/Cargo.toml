[package]
name = "snapglow-desktop"
version = "0.1.0"
description = "SnapGlow desktop application"
authors = ["SnapGlow"]
edition = "2021"

[lib]
name = "snapglow_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-sql = { version = "2", features = ["sqlite"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
