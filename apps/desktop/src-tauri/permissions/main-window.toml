# Every app command, for the main window. build.rs declares them; the overlay gets a subset
# in capabilities/overlay.json.
[[set]]
identifier = "main-window"
description = "All SnapGlow Rust commands, for the main window."
permissions = [
  "allow-capture-region",
  "allow-capture-window",
  "allow-capture-fullscreen",
  "allow-capture-native-command",
  "allow-capture-scrolling-window-command",
  "allow-cancel-live-capture-command",
  "allow-stop-scrolling-capture-command",
  "allow-start-region-recording-command",
  "allow-pause-region-recording-command",
  "allow-resume-region-recording-command",
  "allow-stop-region-recording-command",
  "allow-cancel-region-recording-command",
  "allow-open-path-command",
  "allow-show-live-capture-overlay",
  "allow-list-monitors-command",
  "allow-list-windows-command",
  "allow-get-window-at-point-command",
  "allow-get-capture-overlay-bounds",
  "allow-get-overlay-webview-layout",
  "allow-show-capture-overlay",
  "allow-start-capture-command",
  "allow-capture-overlay-ready",
  "allow-hide-capture-overlay",
  "allow-cancel-capture-overlay",
  "allow-detect-sensitive-data",
  "allow-recognize-text-command",
  "allow-analyze-content-command",
  "allow-compress-export-bytes-command",
  "allow-classify-content-command",
  "allow-stash-capture-image",
  "allow-take-capture-image",
  "allow-take-overlay-preview",
  "allow-take-recording-thumbnail",
  "allow-verify-entitlement",
  "allow-update-capture-shortcut",
  "allow-secure-store-get",
  "allow-secure-store-set",
  "allow-secure-store-delete",
  "allow-cloud-auth-start",
  "allow-cloud-auth-complete",
  "allow-cloud-access-token",
  "allow-cloud-sign-out",
  "allow-db-init",
  "allow-settings-get",
  "allow-settings-set",
  "allow-captures-insert",
  "allow-captures-update-ocr-text",
  "allow-captures-update-tags",
  "allow-captures-list",
  "allow-captures-search",
  "allow-captures-list-by-tag",
  "allow-captures-list-by-collection",
  "allow-captures-get",
  "allow-captures-uid-exists",
  "allow-captures-delete",
  "allow-collections-list",
  "allow-collections-create",
  "allow-collections-rename",
  "allow-collections-delete",
  "allow-collections-add-capture",
  "allow-collections-remove-capture",
  "allow-collections-for-capture",
  "allow-presets-list",
  "allow-presets-create",
  "allow-presets-delete",
  "allow-e2e-show-main-window",
  "allow-e2e-emit-capture-triggered",
  "allow-e2e-inject-screenshot",
  "allow-e2e-temp-export-path",
  "allow-e2e-file-metadata",
  "allow-e2e-hide-main-window",
  "allow-e2e-is-main-window-visible",
  "allow-e2e-is-capture-overlay-visible",
]
