# Advisories accepted after review (2026-10-24 platform audit, FINDING-009).
# Each entry needs a reason and is revisited when the upstream crate ships a fix.
[advisories]
ignore = [
  # openh264-sys2 0.6: heap overflow in the H.264 *decoder*. Xcreener only encodes. Fixed in 0.8 (major bump of `openh264`).
  "RUSTSEC-2025-0008",
  # quick-xml 0.39 via plist <- tauri: parses the app's own Info.plist, not untrusted XML. Waiting on tauri/plist.
  # quick-xml 0.30 is not in the macOS/Windows normal dependency tree.
  "RUSTSEC-2026-0194",
  "RUSTSEC-2026-0195",
  # rkyv 0.7, rsa 0.9: not in the normal dependency tree of any shipped target.
  "RUSTSEC-2026-0235",
  "RUSTSEC-2023-0071",
  # zip 4 via tauri-plugin-updater, Windows only: extracts the update archive after its minisign
  # signature is verified, so a malicious archive already requires the updater key. Fixed in zip 9.
  "RUSTSEC-2026-0367",
  "RUSTSEC-2026-0368",
  "RUSTSEC-2026-0369",
]
