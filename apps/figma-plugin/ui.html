<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>SnapGlow</title>
    <style>
      body {
        font-family: Inter, system-ui, sans-serif;
        font-size: 12px;
        margin: 12px;
        color: #111;
      }
      label {
        display: block;
        margin-bottom: 8px;
      }
      input {
        width: 100%;
        box-sizing: border-box;
        padding: 6px 8px;
        margin-top: 4px;
      }
      button {
        margin-top: 8px;
        margin-right: 6px;
        padding: 6px 10px;
      }
      #preview {
        margin-top: 12px;
        max-width: 100%;
        border-radius: 8px;
        border: 1px solid #ddd;
      }
      #status {
        margin-top: 12px;
        min-height: 16px;
      }
      #captures {
        margin-top: 12px;
        max-height: 160px;
        overflow-y: auto;
      }
      .capture-item {
        padding: 6px;
        border: 1px solid #eee;
        border-radius: 6px;
        margin-bottom: 6px;
        cursor: pointer;
      }
      .capture-item:hover {
        background: #f5f5f5;
      }
    </style>
  </head>
  <body>
    <label>
      API key
      <input id="apiKey" type="password" placeholder="sg_live_..." />
    </label>
    <label>
      API base URL
      <input id="baseUrl" type="text" value="http://localhost:8787" />
    </label>
    <button id="saveConfig">Save</button>
    <hr />
    <button id="importSelection">Import selection → SnapGlow</button>
    <button id="refreshCaptures">Refresh captures</button>
    <div id="status"></div>
    <div id="captures"></div>
    <img id="preview" alt="" hidden />
    <!-- ui-script -->
  </body>
</html>
