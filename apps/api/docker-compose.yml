services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: snapglow
      POSTGRES_PASSWORD: snapglow
      POSTGRES_DB: snapglow
    ports:
      - '127.0.0.1:5432:5432'
    volumes:
      - snapglow_pg:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U snapglow -d snapglow']
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - '127.0.0.1:6379:6379'
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 5s
      retries: 10

  minio:
    # The official minio/minio images left Docker Hub; Bitnami's frozen legacy image keeps the same S3 API.
    image: bitnamilegacy/minio:2025.7.23-debian-12-r3
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - '127.0.0.1:9000:9000'
      - '127.0.0.1:9001:9001'
    volumes:
      - snapglow_minio:/bitnami/minio/data
    healthcheck:
      test: ['CMD', 'curl', '-f', 'http://localhost:9000/minio/health/live']
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  snapglow_pg:
  snapglow_minio:
